<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBMSS</title>
    <meta name="description" content="Event details for DBMSS." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,640&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#details">Skip to details</a>

    <header class="hero">
      <p class="kicker" data-bind="kicker"></p>
      <h1 data-bind="name"></h1>
      <p class="tagline" data-bind="tagline"></p>
      <p class="lede" data-bind="description"></p>
      <p class="meta">
        <span data-bind="when.weekday"></span>
        <span aria-hidden="true">·</span>
        <span data-bind="when.date"></span>
        <span aria-hidden="true">·</span>
        <span data-bind="when.time"></span>
        <span data-bind="when.timezone"></span>
      </p>
      <p class="meta place">
        <span data-bind="where.venue"></span>
        <span aria-hidden="true">·</span>
        <a data-bind-href="where.mapUrl" data-bind="where.city" target="_blank" rel="noreferrer"></a>
      </p>
      <a class="button" data-bind="rsvp.label" data-bind-href="rsvp.href"></a>
      <p class="hint" data-bind="rsvp.note"></p>
    </header>

    <main>
      <section id="details" class="panel">
        <h2>When &amp; where</h2>
        <dl class="facts">
          <div>
            <dt>Date</dt>
            <dd>
              <span data-bind="when.weekday"></span>,
              <span data-bind="when.date"></span>
            </dd>
          </div>
          <div>
            <dt>Time</dt>
            <dd>
              <span data-bind="when.time"></span>
              <span data-bind="when.timezone"></span>
            </dd>
          </div>
          <div>
            <dt>Place</dt>
            <dd>
              <span data-bind="where.venue"></span><br />
              <span data-bind="where.address"></span><br />
              <span data-bind="where.city"></span>
            </dd>
          </div>
          <div>
            <dt>Host</dt>
            <dd>
              <span data-bind="host.name"></span><br />
              <a data-bind="host.email" data-bind-href-mail="host.email"></a>
            </dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <h2>Rundown</h2>
        <ol class="schedule" id="schedule"></ol>
      </section>

      <section class="panel">
        <h2>Questions</h2>
        <div class="faq" id="faq"></div>
      </section>
    </main>

    <footer>
      <p data-bind="footer"></p>
    </footer>

    <script src="content.js"></script>
    <script src="page.js"></script>
  </body>
</html>
